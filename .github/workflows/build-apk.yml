name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      BUILDOZER_WARN_ON_ROOT: "0"

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. JAVA
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 4. SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            pkg-config \
            build-essential \
            cmake \
            ninja-build \
            gettext \
            autopoint \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            python3-dev \
            ccache


      # ============================================================
      # 5. BUILDOZER
      # ============================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "setuptools<81" \
            wheel \
            "Cython==0.29.36" \
            "buildozer==1.5.0"

          echo "================================"
          echo "VERSIONS"
          echo "================================"

          python --version
          java -version
          buildozer --version
          cython --version


      # ============================================================
      # 6. CONFIGURE PYTHON-FOR-ANDROID
      # ============================================================

      - name: Configure python-for-android
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")

          text = path.read_text(
              encoding="utf-8"
          )

          new_lines = []

          for line in text.splitlines():

              stripped = line.strip()

              if stripped.startswith(
                  "p4a.branch"
              ):
                  continue

              if stripped.startswith(
                  "android.sdk_path"
              ):
                  continue

              if stripped.startswith(
                  "android.ndk_path"
              ):
                  continue

              new_lines.append(line)

          text = "\n".join(
              new_lines
          ) + "\n"

          marker = "[buildozer]"

          if marker not in text:
              raise RuntimeError(
                  "Section [buildozer] "
                  "not found in buildozer.spec"
              )

          text = text.replace(
              marker,
              "\n"
              "# Fixed python-for-android version\n"
              "p4a.branch = v2024.01.21\n"
              "\n"
              + marker,
              1,
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "buildozer.spec updated"
          )
          PY

          echo "================================"
          echo "P4A CONFIGURATION"
          echo "================================"

          grep -n \
            "p4a.branch" \
            buildozer.spec


      # ============================================================
      # 7. PREPARE ANDROID SDK
      # ============================================================

      - name: Prepare Android SDK
        run: |
          set -euxo pipefail

          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"

          ZIP_FILE="$RUNNER_TEMP/android-command-line-tools.zip"

          TEMP_DIR="$RUNNER_TEMP/android-command-line-tools"

          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          echo "================================"
          echo "PREPARING ANDROID SDK"
          echo "================================"

          rm -rf "$SDK_DIR"
          rm -rf "$TEMP_DIR"

          mkdir -p \
            "$SDK_DIR/cmdline-tools"

          mkdir -p \
            "$SDK_DIR/licenses"

          mkdir -p \
            "$TEMP_DIR"


          # --------------------------------------------------------
          # Download Android Command Line Tools
          # --------------------------------------------------------

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O "$ZIP_FILE"


          # --------------------------------------------------------
          # Extract
          # --------------------------------------------------------

          unzip -q \
            "$ZIP_FILE" \
            -d "$TEMP_DIR"


          # --------------------------------------------------------
          # Correct modern SDK layout
          #
          # android-sdk/
          #   cmdline-tools/
          #     latest/
          #       bin/
          #       lib/
          #       source.properties
          # --------------------------------------------------------

          mv \
            "$TEMP_DIR/cmdline-tools" \
            "$SDK_DIR/cmdline-tools/latest"


          # --------------------------------------------------------
          # Buildozer 1.5 compatibility layout
          #
          # Buildozer may expect:
          # android-sdk/tools/bin/sdkmanager
          # --------------------------------------------------------

          mkdir -p \
            "$SDK_DIR/tools"

          ln -s \
            "$SDK_DIR/cmdline-tools/latest/bin" \
            "$SDK_DIR/tools/bin"

          ln -s \
            "$SDK_DIR/cmdline-tools/latest/lib" \
            "$SDK_DIR/tools/lib"

          ln -s \
            "$SDK_DIR/cmdline-tools/latest/source.properties" \
            "$SDK_DIR/tools/source.properties"


          # --------------------------------------------------------
          # Android licenses
          # --------------------------------------------------------

          echo \
            "8933bad161af4178b1185d1a37fbf41ea5269c55" \
            > "$SDK_DIR/licenses/android-sdk-license"

          echo \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            >> "$SDK_DIR/licenses/android-sdk-license"

          echo \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$SDK_DIR/licenses/android-sdk-preview-license"


          # --------------------------------------------------------
          # Verify sdkmanager
          #
          # IMPORTANT:
          # Call the REAL modern sdkmanager and explicitly provide
          # --sdk_root.
          # --------------------------------------------------------

          echo "================================"
          echo "SDKMANAGER CHECK"
          echo "================================"

          test -x "$SDKMANAGER"

          test -x \
            "$SDK_DIR/tools/bin/sdkmanager"

          "$SDKMANAGER" \
            --sdk_root="$SDK_DIR" \
            --version


          # --------------------------------------------------------
          # Accept licenses
          # --------------------------------------------------------

          yes | \
            "$SDKMANAGER" \
            --sdk_root="$SDK_DIR" \
            --licenses \
            >/dev/null || true


          # --------------------------------------------------------
          # Install Android packages
          # --------------------------------------------------------

          "$SDKMANAGER" \
            --sdk_root="$SDK_DIR" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


          # --------------------------------------------------------
          # Verify packages
          # --------------------------------------------------------

          echo "================================"
          echo "VERIFY ANDROID PACKAGES"
          echo "================================"

          test -f \
            "$SDK_DIR/platforms/android-35/android.jar"

          test -x \
            "$SDK_DIR/build-tools/35.0.0/aidl"

          test -x \
            "$SDK_DIR/platform-tools/adb"

          test -d \
            "$SDK_DIR/licenses"

          echo "ANDROID SDK CHECK PASSED"


      # ============================================================
      # 8. CLEAN OLD PROJECT BUILD
      # ============================================================

      - name: Clean previous project build
        run: |
          echo "================================"
          echo "CLEANING PROJECT BUILD"
          echo "================================"

          rm -rf .buildozer/android/app
          rm -rf .buildozer/android/platform/build-*
          rm -rf bin

          mkdir -p bin


      # ============================================================
      # 9. VERIFY APPLICATION FILES
      # ============================================================

      - name: Verify application files
        run: |
          echo "================================"
          echo "PROJECT FILES"
          echo "================================"

          pwd

          ls -la

          echo "--------------------------------"
          echo "buildozer.spec"
          echo "--------------------------------"

          test -f buildozer.spec

          grep -E \
            "^(title|package.name|package.domain|source.dir|requirements|android.api|android.minapi|android.archs|p4a.branch)" \
            buildozer.spec || true

          echo "--------------------------------"
          echo "Python files"
          echo "--------------------------------"

          find . \
            -maxdepth 2 \
            -type f \
            -name "*.py" \
            -print


      # ============================================================
      # 10. FINAL ANDROID ENVIRONMENT CHECK
      # ============================================================

      - name: Final Android environment check
        run: |
          set -euxo pipefail

          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"

          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          echo "================================"
          echo "FINAL ANDROID CHECK"
          echo "================================"

          echo "SDK:"
          echo "$SDK_DIR"

          echo "--------------------------------"

          test -d "$SDK_DIR"

          test -x "$SDKMANAGER"

          test -x \
            "$SDK_DIR/tools/bin/sdkmanager"

          test -f \
            "$SDK_DIR/platforms/android-35/android.jar"

          test -x \
            "$SDK_DIR/build-tools/35.0.0/aidl"

          test -x \
            "$SDK_DIR/platform-tools/adb"

          "$SDKMANAGER" \
            --sdk_root="$SDK_DIR" \
            --version

          echo "--------------------------------"

          java -version

          python --version

          buildozer --version

          echo "================================"
          echo "ENVIRONMENT READY"
          echo "================================"


      # ============================================================
      # 11. BUILD APK
      # ============================================================

      - name: Build APK
        run: |
          set -o pipefail

          echo "================================"
          echo "STARTING APK BUILD"
          echo "================================"

          buildozer -v android debug 2>&1 | tee build.log


      # ============================================================
      # 12. UPLOAD BUILD LOG
      # ============================================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      # ============================================================
      # 13. SEARCH FOR APK
      # ============================================================

      - name: Search for APK
        if: always()
        run: |
          echo "================================"
          echo "SEARCHING FOR APK"
          echo "================================"

          find . \
            -type f \
            -name "*.apk" \
            -print \
            2>/dev/null || true


      # ============================================================
      # 14. VERIFY APK
      # ============================================================

      - name: Verify APK
        run: |
          echo "================================"
          echo "VERIFY APK"
          echo "================================"

          APK_COUNT=$(find bin -type f -name "*.apk" | wc -l)

          echo "APK files found: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK WAS NOT CREATED"
            exit 1
          fi

          find bin \
            -type f \
            -name "*.apk" \
            -ls

          echo "================================"
          echo "APK BUILD SUCCESS"
          echo "================================"


      # ============================================================
      # 15. RENAME APK
      # ============================================================

      - name: Rename APK
        run: |
          echo "================================"
          echo "RENAMING APK"
          echo "================================"

          APK_FILE=$(find bin -maxdepth 1 -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK FILE NOT FOUND"
            exit 1
          fi

          NEW_APK="bin/TEST_OVIK_${{ github.run_number }}.apk"

          mv "$APK_FILE" "$NEW_APK"

          echo "Original APK:"
          echo "$APK_FILE"

          echo "New APK:"
          echo "$NEW_APK"

          test -f "$NEW_APK"

          echo "================================"
          echo "APK RENAME SUCCESS"
          echo "================================"


      # ============================================================
      # 16. UPLOAD APK
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST_OVIK_${{ github.run_number }}
          path: bin/TEST_OVIK_${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 14
